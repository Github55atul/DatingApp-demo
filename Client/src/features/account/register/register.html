<div class="flex justify-center mt-8">
    <div class="card w-full max-w-4xl bg-base-100 shadow-2xl">

        <div class="card-body px-10 py-8">

            <h2 class="text-5xl font-bold text-center text-primary mb-8">
                Sign up
            </h2>

            <form #registerForm="ngForm" (ngSubmit)="register()">

                <div class="w-2/3 mx-auto space-y-5">

                    <input type="text" name="displayName" [(ngModel)]="creds.displayName" placeholder="Display Name"
                        class="input input-bordered w-full" required>

                    <input type="email" name="email" [(ngModel)]="creds.email" placeholder="Email"
                        class="input input-bordered w-full" required>

                    <input type="password" name="password" [(ngModel)]="creds.password" placeholder="Password"
                        class="input input-bordered w-full" required>

                     

                </div>

                <div class="flex justify-center items-center gap-4 mt-10">
                    <button type="button" class="btn btn-outline" (click)="cancel()">
                        Cancel
                    </button>

                    <button type="submit" class="btn btn-primary" [disabled]="registerForm.invalid">
                        Register
                    </button>
                </div>

            </form>

        </div>

    </div>
</div>
