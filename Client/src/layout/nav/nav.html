<header class="p-3 w-full fixed top-0 z-50 bg-gradient-to-r from-primary to-black">
    <div class="flex align-middle items-center px-10 mx-auto gap-6">

        <a routerLink="/" class="flex items-center max-h-16 text-white border-r-white border-r-2 pr-6">

            <svg xmlns="http://www.w3.org/2000/svg"
                 viewBox="0 0 24 24"
                 fill="currentColor"
                 class="size-9">

                <path
                    d="M4.5 6.375a4.125 4.125 0 1 1 8.25 0 4.125 4.125 0 0 1-8.25 0ZM14.25 8.625
                       c0-2.28 1.845-4.125 4.125-4.125S22.5 6.345 22.5 8.625
                       s-1.845 4.125-4.125 4.125S14.25 10.905 14.25 8.625ZM4.848
                       15.238a5.625 5.625 0 0 1 9.304 0A12.318 12.318 0 0 1
                       9.75 16.5c-1.665 0-3.26-.325-4.75-.912ZM17.25
                       16.5c-.716 0-1.423-.06-2.111-.175a6.373 6.373 0 0
                       0-1.041-2.728A8.947 8.947 0 0 1 17.25
                       13.5c1.932 0 3.786.607 5.324 1.636a.75.75 0 0
                       1 .176 1.041A12.325 12.325 0 0 1 17.25 16.5Z" />

            </svg>

            <h3 class="text-2xl font-semibold text-white uppercase">
                Dating app
            </h3>

        </a>

        <nav class="flex gap-3 my-2 uppercase text-lg text-white">
          @if(accountService.currentUser())
          {
              <a routerLink="/members" routerLinkActive="text-accent">Matches</a>
            <a routerLink="/lists" routerLinkActive="text-accent">Lists</a>
            <a routerLink="/messages" routerLinkActive="text-accent">Messages</a>

          }
          
        </nav>

        <div class="flex align-middle ml-auto gap-3">
              @if (accountService.currentUser(); as user) {

    <div class="dropdown dropdown-end">

      <div
        tabindex="0"
        role="button"
        class="flex items-center text-white text-xl gap-3 cursor-pointer">

        <img
          src="/user.png"
          alt="user avatar"
          class="w-8 h-8 rounded-full">

        <span>{{user.displayName}}</span>

      </div>

      <ul
        tabindex="0"
        class="dropdown-content menu bg-base-100 rounded-box z-1 w-52 p-2 shadow">

        <li>
          <a>Edit profile</a>
        </li>

        <li>
          <a (click)="logout()">Logout</a>
        </li>

      </ul>

    </div>

  }
  @else {
                <form #loginForm="ngForm" (ngSubmit)="login()" class="flex items-center gap-3">

                <input
                [(ngModel)]="creds.email"
                name="email"
                    type="text"
                    class="input"
                    placeholder="Email">

                <input
                [(ngModel)]="creds.password"
                name="password"
                    type="password"
                    class="input"
                    placeholder="Password">

                <button type="submit" class="btn">
                    Login
                </button>

            </form>

  }



        </div>

    </div>
</header>
